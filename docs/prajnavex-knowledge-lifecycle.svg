<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940" role="img" aria-labelledby="title desc">
  <title id="title">Prajnavex 知识库结构与知识生命周期</title>
  <desc id="desc">从原始材料进入 inbox，到 Source/Card/Skill/Bundle 结构化、索引关联、使用、复核、过期和归档的流程图。</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; fill: #111827; }
