  <rect width="1400" height="940" fill="#ffffff"/>
  <text class="title" x="52" y="54">Prajnavex 知识库结构与知识生命周期</text>
  <text class="subtitle" x="52" y="82">raw input -> inbox -> source -> card -> skill -> bundle -> tool/workflow；frontmatter 是机器索引层，Markdown 正文是人类阅读层。</text>
