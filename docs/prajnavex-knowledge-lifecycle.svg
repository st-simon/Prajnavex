    .flow { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
    .write { fill: none; stroke: #16a34a; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#arrow-green); }
    .control { fill: none; stroke: #ea580c; stroke-width: 1.9; marker-end: url(#arrow-orange); }
    .read { fill: none; stroke: #059669; stroke-width: 1.9; marker-end: url(#arrow-emerald); }
    .audit { fill: none; stroke: #9333ea; stroke-width: 1.9; stroke-dasharray: 5 4; marker-end: url(#arrow-purple); }
