  <rect class="box box" x="1105" y="160" width="220" height="82"/>
  <text class="node-title" x="1123" y="188">Obsidian 工作台</text>
  <text class="node-sub" x="1123" y="211">阅读 / 编辑 / 链接</text>
  <text class="node-sub" x="1123" y="228">判断与批准</text>
  <rect class="box box" x="1105" y="280" width="220" height="82"/>
  <text class="node-title" x="1123" y="308">Web UI / CLI</text>
  <text class="node-sub" x="1123" y="331">队列浏览 / 批准</text>
  <text class="node-sub" x="1123" y="348">本地操作客户端</text>
  <rect class="box bundle" x="1105" y="400" width="220" height="82"/>
  <text class="node-title" x="1123" y="428">Knowledge API</text>
  <text class="node-sub" x="1123" y="451">search / get / cite</text>
  <text class="node-sub" x="1123" y="468">frontmatter-first</text>
  <rect class="box card" x="1105" y="520" width="220" height="82"/>
  <text class="node-title" x="1123" y="548">Context Pack</text>
  <text class="node-sub" x="1123" y="571">surface -> trigger -> load</text>
  <text class="node-sub" x="1123" y="588">bounded body + citation</text>
  <rect class="box skill" x="1105" y="640" width="220" height="82"/>
  <text class="node-title" x="1123" y="668">工具 / 工作流</text>
  <text class="node-sub" x="1123" y="691">Codex / Claude / scripts</text>
  <text class="node-sub" x="1123" y="708">复用技能与包</text>
  <rect class="dash" x="350" y="770" width="1010" height="86"/>
  <text class="lane-title" x="372" y="800">机器索引与关联层</text>
  <text class="node-sub" x="372" y="826">frontmatter 字段：id / type / stage / tags / confidence / staleness / authority_path / allowed_consumers</text>
  <text class="node-sub" x="372" y="846">Link fields 建图：source_id, related_cards, promoted_skills, source_cards, skills；生成 index/knowledge-index.json 与 backlinks。</text>
