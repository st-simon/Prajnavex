  <text class="lane-title" x="60" y="143">采集 / 暂存</text>
  <rect class="lane" x="350" y="115" width="420" height="630"/>
  <text class="lane-title" x="368" y="143">分解 / 结构化</text>
  <rect class="lane" x="795" y="115" width="255" height="630"/>
  <text class="lane-title" x="813" y="143">知识核心</text>
  <rect class="lane" x="1075" y="115" width="285" height="630"/>
  <text class="lane-title" x="1093" y="143">使用 / 复用</text>
  <rect class="box source" x="68" y="165" width="230" height="92"/>
  <text class="node-title" x="86" y="193">原始素材</text>
  <text class="node-sub" x="86" y="216">链接 / PDF / MD / TXT</text>
  <text class="node-sub" x="86" y="233">截图 / 图片 / 临时想法</text>
